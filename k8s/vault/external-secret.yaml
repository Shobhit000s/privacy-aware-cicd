# k8s/vault/external-secret.yaml
#
# Requires the External Secrets Operator (https://external-secrets.io) installed
# in-cluster, and a SecretStore pointing at Vault (created by vault/setup.sh's
# kubernetes-auth step). This is the declarative link between Vault's
# secret/data/prod/backend path and the real K8s Secret backend-deployment.yaml
# consumes via `secretRef: app-runtime-config`.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: production
spec:
  provider:
    vault:
      server: "http://vault.vault-system:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "privacy-aware-app"
          serviceAccountRef:
            name: privacy-aware-app-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-runtime-config
  namespace: production
spec:
  refreshInterval: 1h   # picks up rotations from scripts/secret_rotation.py without a redeploy
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: app-runtime-config
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/backend
        property: database_url
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: prod/backend
        property: jwt_secret_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: prod/postgres, property: username }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: prod/postgres, property: password }
    - secretKey: POSTGRES_DB
      remoteRef: { key: prod/postgres, property: dbname }
