apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: production
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # avoid "lost+found" issues on some CSI drivers
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app_user", "-d", "privacy_cicd"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app_user", "-d", "privacy_cicd"]
            initialDelaySeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: production
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None   # headless, standard for StatefulSet
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: production
  annotations:
    managed-by: "external-secrets-operator"
    vault-path: "secret/data/prod/postgres"
type: Opaque
stringData:
  POSTGRES_USER: "REPLACE_ME_INJECTED_BY_VAULT"
  POSTGRES_PASSWORD: "REPLACE_ME_INJECTED_BY_VAULT"
  POSTGRES_DB: "privacy_cicd"
