# k8s/base/secret.yaml
#
# This is a TEMPLATE, not a real secret — no plaintext values are committed.
# In production, secrets are populated one of two ways (see docs/ARCHITECTURE.md
# and vault/README.md):
#
#   1. Vault Agent sidecar injection (see the vault.hashicorp.com/agent-inject-*
#      annotations on k8s/base/deployment.yaml) — the app reads secrets from a
#      file mounted at /vault/secrets/, this K8s Secret object isn't used at all.
#
#   2. External Secrets Operator, which syncs FROM Vault INTO a real K8s Secret
#      with this shape, so existing tooling that expects envFrom/secretKeyRef
#      keeps working. That's what this manifest documents.
#
# To create the ExternalSecret that generates the real Secret at this name:
#   kubectl apply -f k8s/vault/external-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-runtime-config
  namespace: production
  annotations:
    managed-by: "external-secrets-operator"
    vault-path: "secret/data/prod/backend"
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_ME_INJECTED_BY_VAULT"
  JWT_SECRET_KEY: "REPLACE_ME_INJECTED_BY_VAULT"
