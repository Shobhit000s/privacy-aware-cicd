apiVersion: v1
kind: ServiceAccount
metadata:
  name: privacy-aware-app-sa
  namespace: production
  annotations:
    # Enables Vault's Kubernetes auth method to trust this SA for secret access
    vault.hashicorp.com/role: "privacy-aware-app"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-dashboard-sa
  namespace: production
  annotations:
    vault.hashicorp.com/role: "ops-dashboard"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: privacy-aware-app-role
  namespace: production
rules:
  # The backend can read (not write) its own ConfigMap/Secret for
  # self-diagnostics, and nothing else — least privilege.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["backend-config"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]   # for the /healthz deep-check + dashboard pod status view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: privacy-aware-app-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: privacy-aware-app-sa
    namespace: production
roleRef:
  kind: Role
  name: privacy-aware-app-role
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-wide read-only role for the CI pipeline's deploy step (kubectl apply),
# bound via a separate CI service account — kept minimal, no cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-deployer-binding
subjects:
  - kind: ServiceAccount
    name: ci-deployer-sa
    namespace: production
roleRef:
  kind: ClusterRole
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
