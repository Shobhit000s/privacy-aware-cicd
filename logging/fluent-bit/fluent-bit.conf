[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  5
    Mem_Buf_Limit     10MB

[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  cluster privacy-aware-cicd
    Record  source  fluent-bit

# Route anything that looks like it came from the privacy scanner / gitleaks
# report into a dedicated index for the compliance dashboard to query.
[FILTER]
    Name    grep
    Match   docker.*
    Regex   log (privacy_scan|gitleaks|trivy|opa_denial)

[OUTPUT]
    Name            opensearch
    Match           docker.*
    Host            opensearch
    Port            9200
    Index           privacy-cicd-logs
    Suppress_Type_Name On
    Retry_Limit     5
