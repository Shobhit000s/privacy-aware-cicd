name: Privacy-Aware CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

env:
  REGISTRY: ghcr.io/shobhit000s
  IMAGE_BACKEND: privacy-cicd-backend
  IMAGE_FRONTEND: privacy-cicd-frontend
  RISK_THRESHOLD: "70"

jobs:

  # ---------------------------------------------------------------------
  # Stage 1: Secret detection
  # ---------------------------------------------------------------------
  secret-scan:
    name: "1. Gitleaks Secret Scan"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks/.gitleaks.toml

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Run custom privacy scanner
        run: |
          python3 scanner/privacy_scanner.py --path . --format json \
            --out privacy-scan-report.json --fail-on HIGH

      - name: Upload privacy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-scan-report
          path: privacy-scan-report.json


  # ---------------------------------------------------------------------
  # Stage 2: Container / dependency vulnerability scan
  # ---------------------------------------------------------------------
  vuln-scan:
    name: "2. Trivy Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} \
            -f backend/Dockerfile backend/

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} \
            -f app/frontend/Dockerfile app/frontend/

      # -----------------------------------------------------------------
      # Diagnostic backend scan
      # -----------------------------------------------------------------
      - name: Show backend vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ env.IMAGE_BACKEND }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          format: "table"

      # -----------------------------------------------------------------
      # Backend security gate
      # -----------------------------------------------------------------
      - name: Trivy scan — backend (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ env.IMAGE_BACKEND }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-backend.sarif"

      # -----------------------------------------------------------------
      # Diagnostic frontend scan
      # -----------------------------------------------------------------
      - name: Show frontend vulnerabilities
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ env.IMAGE_FRONTEND }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          format: "table"

      # -----------------------------------------------------------------
      # Frontend security gate
      # -----------------------------------------------------------------
      - name: Trivy scan — frontend (fail on CRITICAL/HIGH)
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "${{ env.IMAGE_FRONTEND }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-frontend.sarif"

      # -----------------------------------------------------------------
      # Upload SARIF results
      # -----------------------------------------------------------------
      - name: Upload Trivy SARIF (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-backend.sarif"
          category: trivy-backend

      - name: Upload Trivy SARIF (frontend)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend.sarif"
          category: trivy-frontend

      # -----------------------------------------------------------------
      # Archive raw reports
      # -----------------------------------------------------------------
      - name: Archive raw Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.sarif


  # ---------------------------------------------------------------------
  # Stage 3: Policy-as-code check
  # ---------------------------------------------------------------------
  policy-check:
    name: "3. OPA Policy Gate"
    runs-on: ubuntu-latest
    needs: vuln-scan

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa \
            https://openpolicyagent.org/downloads/v0.65.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Build deployment input document
        run: |
          python scripts/build_opa_input.py --out /tmp/input.json

      - name: Evaluate privacy policy
        run: |
          opa eval \
            --input /tmp/input.json \
            --data policies/opa/privacy_policy.rego \
            --data policies/opa/deployment_policy.rego \
            "data.privacy.deny[_]" \
            --format pretty \
            --fail-defined


  # ---------------------------------------------------------------------
  # Stage 4: ML privacy-risk prediction
  # ---------------------------------------------------------------------
  risk-prediction:
    name: "4. ML Privacy Risk Prediction"
    runs-on: ubuntu-latest
    needs: policy-check

    outputs:
      risk_score: ${{ steps.predict.outputs.risk_score }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Extract deployment features
        run: |
          python ml/risk_predictor/features.py \
            --diff-base origin/main \
            --out /tmp/features.json

      - name: Predict risk score
        id: predict
        run: |
          SCORE=$(python ml/risk_predictor/predict_risk.py \
            --features /tmp/features.json \
            --json | \
            python -c "import sys,json; print(json.load(sys.stdin)['risk_score'])")

          echo "risk_score=$SCORE" >> "$GITHUB_OUTPUT"

          echo "Predicted privacy risk score: $SCORE / 100"

          python -c \
            "import sys; s=float('$SCORE'); sys.exit(1 if s >= ${{ env.RISK_THRESHOLD }} else 0)"


  # ---------------------------------------------------------------------
  # Stage 5: Vault Secret Rotation
  # ---------------------------------------------------------------------
  secret-rotation:
    name: "5. Vault Secret Rotation"
    runs-on: ubuntu-latest
    needs: risk-prediction

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # -----------------------------------------------------------------
      # Start temporary Vault
      # -----------------------------------------------------------------
      - name: Start temporary Vault
        run: |
          docker run -d \
            --name github-vault \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=ci-dev-root-token \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.17

      # -----------------------------------------------------------------
      # Wait for Vault
      # -----------------------------------------------------------------
      - name: Wait for Vault
        run: |
          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:8200/v1/sys/health \
              > /dev/null; then

              echo "Vault is ready."
              exit 0
            fi

            echo "Waiting for Vault..."
            sleep 2
          done

          echo "Vault did not become ready."
          docker logs github-vault
          exit 1

      # -----------------------------------------------------------------
      # Configure Vault
      # -----------------------------------------------------------------
      - name: Configure Vault
        run: |
          echo "Configuring temporary Vault..."

          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=ci-dev-root-token \
            github-vault \
            vault secrets enable \
            -path=secret \
            -version=2 \
            kv || true

          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=ci-dev-root-token \
            github-vault \
            vault kv put secret/ci \
            ci_role_id="ci-demo-role"

          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=ci-dev-root-token \
            github-vault \
            vault kv put secret/prod/backend \
            database_url="postgresql://ci-user:ci-password@localhost:5432/privacy_cicd" \
            jwt_secret_key="ci-demo-jwt-secret"

          echo "Vault configuration completed."

      # -----------------------------------------------------------------
      # Verify Vault
      # -----------------------------------------------------------------
      - name: Verify Vault secrets
        run: |
          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=ci-dev-root-token \
            github-vault \
            vault kv get secret/ci

          docker exec \
            -e VAULT_ADDR=http://127.0.0.1:8200 \
            -e VAULT_TOKEN=ci-dev-root-token \
            github-vault \
            vault kv get secret/prod/backend

          echo "Vault secret verification passed."

      # -----------------------------------------------------------------
      # Run secret rotation
      # -----------------------------------------------------------------
      - name: Rotate touched secrets
        run: |
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=ci-dev-root-token

          python scripts/secret_rotation.py \
            --diff-base origin/main \
            --vault-addr "$VAULT_ADDR"

      # -----------------------------------------------------------------
      # Cleanup Vault
      # -----------------------------------------------------------------
      - name: Stop temporary Vault
        if: always()
        run: |
          docker rm -f github-vault || true


  # ---------------------------------------------------------------------
  # Stage 6: Build, publish and deploy to temporary Kubernetes
  # ---------------------------------------------------------------------
  deploy:
    name: "6. Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: secret-rotation

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # Login to GitHub Container Registry
      # -----------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # Build backend
      # -----------------------------------------------------------------
      - name: Build backend image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_BACKEND:${{ github.sha }} \
            -f backend/Dockerfile backend/

      # -----------------------------------------------------------------
      # Build frontend
      # -----------------------------------------------------------------
      - name: Build frontend image
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_FRONTEND:${{ github.sha }} \
            -f app/frontend/Dockerfile app/frontend/

      # -----------------------------------------------------------------
      # Build ops dashboard
      # -----------------------------------------------------------------
      - name: Build ops dashboard image
        run: |
          docker build \
            -t $REGISTRY/privacy-cicd-ops-dashboard:${{ github.sha }} \
            -f docker/Dockerfile .

      # -----------------------------------------------------------------
      # Push images to GHCR
      # -----------------------------------------------------------------
      - name: Push backend image
        run: |
          docker push \
            $REGISTRY/$IMAGE_BACKEND:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            $REGISTRY/$IMAGE_FRONTEND:${{ github.sha }}

      - name: Push ops dashboard image
        run: |
          docker push \
            $REGISTRY/privacy-cicd-ops-dashboard:${{ github.sha }}

      # -----------------------------------------------------------------
      # Create temporary Kind cluster
      # -----------------------------------------------------------------
      - name: Create temporary Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: privacy-cicd
          wait: 120s

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get namespaces

      # -----------------------------------------------------------------
      # Load locally built images into Kind
      # -----------------------------------------------------------------
      - name: Load backend image into Kind
        run: |
          kind load docker-image \
            $REGISTRY/$IMAGE_BACKEND:${{ github.sha }} \
            --name privacy-cicd

      - name: Load frontend image into Kind
        run: |
          kind load docker-image \
            $REGISTRY/$IMAGE_FRONTEND:${{ github.sha }} \
            --name privacy-cicd

      - name: Load ops dashboard image into Kind
        run: |
          kind load docker-image \
            $REGISTRY/privacy-cicd-ops-dashboard:${{ github.sha }} \
            --name privacy-cicd

      - name: Verify images inside Kind
        run: |
          echo "===== IMAGES INSIDE KIND ====="
          docker exec privacy-cicd-control-plane \
            crictl images | grep privacy-cicd || true

          echo "===== DOCKER IMAGES ====="
          docker images | grep privacy-cicd || true

      # -----------------------------------------------------------------
      # Replace image placeholders in the existing k8s/base manifests
      # -----------------------------------------------------------------
      - name: Update Kubernetes image references
        run: |
          sed -i \
            "s#__BACKEND_IMAGE__#$REGISTRY/$IMAGE_BACKEND:${{ github.sha }}#g" \
            k8s/base/backend-deployment.yaml

          sed -i \
            "s#__FRONTEND_IMAGE__#$REGISTRY/$IMAGE_FRONTEND:${{ github.sha }}#g" \
            k8s/base/frontend-deployment.yaml

          sed -i \
            "s#__IMAGE__#$REGISTRY/privacy-cicd-ops-dashboard:${{ github.sha }}#g" \
            k8s/base/ops-dashboard-deployment.yaml

          echo "===== BACKEND IMAGE ====="
          grep -n "image:" k8s/base/backend-deployment.yaml

          echo "===== FRONTEND IMAGE ====="
          grep -n "image:" k8s/base/frontend-deployment.yaml

          echo "===== OPS DASHBOARD IMAGE ====="
          grep -n "image:" k8s/base/ops-dashboard-deployment.yaml

      # -----------------------------------------------------------------
      # Fail immediately if any image placeholder remains
      # -----------------------------------------------------------------
      - name: Check unresolved image placeholders
        run: |
          if grep -R "__BACKEND_IMAGE__" k8s/base; then
            echo "ERROR: unresolved __BACKEND_IMAGE__ placeholder."
            exit 1
          fi

          if grep -R "__FRONTEND_IMAGE__" k8s/base; then
            echo "ERROR: unresolved __FRONTEND_IMAGE__ placeholder."
            exit 1
          fi

          if grep -R "__IMAGE__" k8s/base; then
            echo "ERROR: unresolved __IMAGE__ placeholder."
            exit 1
          fi

          echo "All Kubernetes image placeholders resolved."

      # -----------------------------------------------------------------
      # Render and validate manifests
      # -----------------------------------------------------------------
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize k8s/base/ > /tmp/rendered-manifests.yaml

          echo "===== RENDERED IMAGE REFERENCES ====="
          grep -n "image:" /tmp/rendered-manifests.yaml || true

          echo "===== KUBERNETES CLIENT VERSION ====="
          kubectl version --client

      # -----------------------------------------------------------------
      # Apply the existing production manifests
      # -----------------------------------------------------------------
      - name: Apply K8s manifests
        run: |
          kubectl apply -k k8s/base/

      # -----------------------------------------------------------------
      # The temporary CI Kind cluster does not contain a Vault injector.
      # Replace the Vault placeholder PostgreSQL Secret with CI-only
      # credentials before starting the application workloads.
      # -----------------------------------------------------------------
      - name: Configure CI PostgreSQL credentials
        run: |
          kubectl -n production delete secret postgres-credentials \
            --ignore-not-found

          kubectl -n production create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=app_user \
            --from-literal=POSTGRES_PASSWORD=ci-temporary-password \
            --from-literal=POSTGRES_DB=privacy_cicd

          echo "CI PostgreSQL credentials created."

      # -----------------------------------------------------------------
      # Backend and ops dashboard runtime configuration
      # -----------------------------------------------------------------
      - name: Configure application runtime secrets
        run: |
          kubectl -n production delete secret app-runtime-config \
            --ignore-not-found

          kubectl -n production create secret generic app-runtime-config \
            --from-literal=DATABASE_URL='postgresql+psycopg2://app_user:ci-temporary-password@postgres:5432/privacy_cicd' \
            --from-literal=JWT_SECRET_KEY='ci-temporary-jwt-secret'

          echo "CI application runtime configuration created."

      # -----------------------------------------------------------------
      # Fix frontend non-root nginx binding for the CI deployment.
      #
      # The frontend runs as UID 101 and drops all capabilities.
      # nginx listens on port 80, so NET_BIND_SERVICE is required.
      # This keeps the container non-root and only adds the capability
      # needed to bind the existing port 80.
      # -----------------------------------------------------------------
      - name: Configure frontend non-root port binding
        run: |
          kubectl -n production patch deployment frontend \
            --type='strategic' \
            -p='
          spec:
            template:
              spec:
                containers:
                - name: frontend
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      add:
                      - NET_BIND_SERVICE
                      drop:
                      - ALL
          '

      # -----------------------------------------------------------------
      # Restart workloads after CI Secrets and frontend security context
      # have been configured.
      # -----------------------------------------------------------------
      - name: Restart application workloads
        run: |
          kubectl -n production rollout restart deployment/backend
          kubectl -n production rollout restart deployment/frontend
          kubectl -n production rollout restart deployment/ops-dashboard

          # Recreate PostgreSQL so the new Secret values are read by
          # the container environment.
          kubectl -n production delete pod \
            -l app=postgres \
            --ignore-not-found

      # -----------------------------------------------------------------
      # Wait for PostgreSQL first
      # -----------------------------------------------------------------
      - name: Wait for PostgreSQL rollout
        run: |
          if ! kubectl rollout status statefulset/postgres \
            -n production \
            --timeout=180s; then

            echo "=================================================="
            echo "POSTGRES ROLLOUT FAILED"
            echo "=================================================="

            echo "===== POSTGRES PODS ====="
            kubectl get pods \
              -n production \
              -l app=postgres \
              -o wide || true

            echo "===== POSTGRES DESCRIPTION ====="
            kubectl describe pods \
              -n production \
              -l app=postgres || true

            echo "===== POSTGRES LOGS ====="
            kubectl logs \
              -n production \
              -l app=postgres \
              --all-containers=true \
              --tail=200 || true

            echo "===== PREVIOUS POSTGRES LOGS ====="
            kubectl logs \
              -n production \
              -l app=postgres \
              --all-containers=true \
              --previous \
              --tail=200 || true

            echo "===== POSTGRES EVENTS ====="
            kubectl get events \
              -n production \
              --sort-by='.lastTimestamp' || true

            exit 1
          fi

      # -----------------------------------------------------------------
      # Wait for backend
      # -----------------------------------------------------------------
      - name: Wait for backend rollout
        run: |
          if ! kubectl rollout status deployment/backend \
            -n production \
            --timeout=180s; then

            echo "=================================================="
            echo "BACKEND ROLLOUT FAILED"
            echo "=================================================="

            echo "===== BACKEND DEPLOYMENT ====="
            kubectl get deployment backend \
              -n production \
              -o wide || true

            echo "===== BACKEND PODS ====="
            kubectl get pods \
              -n production \
              -l app=backend \
              -o wide || true

            echo "===== BACKEND DESCRIPTION ====="
            kubectl describe pods \
              -n production \
              -l app=backend || true

            echo "===== BACKEND LOGS ====="
            kubectl logs \
              -n production \
              -l app=backend \
              --all-containers=true \
              --tail=200 || true

            echo "===== PREVIOUS BACKEND LOGS ====="
            kubectl logs \
              -n production \
              -l app=backend \
              --all-containers=true \
              --previous \
              --tail=200 || true

            echo "===== BACKEND EVENTS ====="
            kubectl get events \
              -n production \
              --sort-by='.lastTimestamp' || true

            exit 1
          fi

      # -----------------------------------------------------------------
      # Wait for frontend
      # -----------------------------------------------------------------
      - name: Wait for frontend rollout
        run: |
          if ! kubectl rollout status deployment/frontend \
            -n production \
            --timeout=180s; then

            echo "=================================================="
            echo "FRONTEND ROLLOUT FAILED"
            echo "=================================================="

            echo "===== FRONTEND DEPLOYMENT ====="
            kubectl get deployment frontend \
              -n production \
              -o wide || true

            echo "===== FRONTEND PODS ====="
            kubectl get pods \
              -n production \
              -l app=frontend \
              -o wide || true

            echo "===== FRONTEND DESCRIPTION ====="
            kubectl describe pods \
              -n production \
              -l app=frontend || true

            echo "===== FRONTEND LOGS ====="
            kubectl logs \
              -n production \
              -l app=frontend \
              --all-containers=true \
              --tail=200 || true

            echo "===== PREVIOUS FRONTEND LOGS ====="
            kubectl logs \
              -n production \
              -l app=frontend \
              --all-containers=true \
              --previous \
              --tail=200 || true

            echo "===== FRONTEND EVENTS ====="
            kubectl get events \
              -n production \
              --sort-by='.lastTimestamp' || true

            exit 1
          fi

      # -----------------------------------------------------------------
      # Wait for ops dashboard
      # -----------------------------------------------------------------
      - name: Wait for ops dashboard rollout
        run: |
          if ! kubectl rollout status deployment/ops-dashboard \
            -n production \
            --timeout=180s; then

            echo "=================================================="
            echo "OPS DASHBOARD ROLLOUT FAILED"
            echo "=================================================="

            echo "===== OPS DASHBOARD DEPLOYMENT ====="
            kubectl get deployment ops-dashboard \
              -n production \
              -o wide || true

            echo "===== OPS DASHBOARD PODS ====="
            kubectl get pods \
              -n production \
              -l app=ops-dashboard \
              -o wide || true

            echo "===== OPS DASHBOARD DESCRIPTION ====="
            kubectl describe pods \
              -n production \
              -l app=ops-dashboard || true

            echo "===== OPS DASHBOARD LOGS ====="
            kubectl logs \
              -n production \
              -l app=ops-dashboard \
              --all-containers=true \
              --tail=200 || true

            echo "===== PREVIOUS OPS DASHBOARD LOGS ====="
            kubectl logs \
              -n production \
              -l app=ops-dashboard \
              --all-containers=true \
              --previous \
              --tail=200 || true

            echo "===== OPS DASHBOARD EVENTS ====="
            kubectl get events \
              -n production \
              --sort-by='.lastTimestamp' || true

            exit 1
          fi

      # -----------------------------------------------------------------
      # Final deployment verification
      # -----------------------------------------------------------------
      - name: Verify deployment
        run: |
          echo "===== NAMESPACE ====="
          kubectl get namespace production

          echo ""
          echo "===== PODS ====="
          kubectl get pods \
            -n production \
            -o wide

          echo ""
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments \
            -n production \
            -o wide

          echo ""
          echo "===== STATEFULSETS ====="
          kubectl get statefulsets \
            -n production \
            -o wide

          echo ""
          echo "===== SERVICES ====="
          kubectl get services \
            -n production

          echo ""
          echo "===== BACKEND ====="
          kubectl get deployment backend \
            -n production \
            -o wide

          echo ""
          echo "===== FRONTEND ====="
          kubectl get deployment frontend \
            -n production \
            -o wide

          echo ""
          echo "===== OPS DASHBOARD ====="
          kubectl get deployment ops-dashboard \
            -n production \
            -o wide

          echo ""
          echo "===== POSTGRES ====="
          kubectl get statefulset postgres \
            -n production \
            -o wide

      # -----------------------------------------------------------------
      # Always collect Kubernetes diagnostics
      # -----------------------------------------------------------------
      - name: Collect Kubernetes diagnostics
        if: always()
        run: |
          echo "========================================="
          echo "ALL PODS"
          echo "========================================="
          kubectl get pods -A -o wide || true

          echo ""
          echo "========================================="
          echo "DEPLOYMENTS"
          echo "========================================="
          kubectl get deployments -A -o wide || true

          echo ""
          echo "========================================="
          echo "STATEFULSETS"
          echo "========================================="
          kubectl get statefulsets -A -o wide || true

          echo ""
          echo "========================================="
          echo "SERVICES"
          echo "========================================="
          kubectl get services -A || true

          echo ""
          echo "========================================="
          echo "EVENTS"
          echo "========================================="
          kubectl get events -A \
            --sort-by='.lastTimestamp' || true

          echo ""
          echo "========================================="
          echo "POSTGRES LOGS"
          echo "========================================="
          kubectl logs \
            -n production \
            -l app=postgres \
            --all-containers=true \
            --tail=200 || true

          echo ""
          echo "========================================="
          echo "BACKEND LOGS"
          echo "========================================="
          kubectl logs \
            -n production \
            -l app=backend \
            --all-containers=true \
            --tail=200 || true

          echo ""
          echo "========================================="
          echo "FRONTEND LOGS"
          echo "========================================="
          kubectl logs \
            -n production \
            -l app=frontend \
            --all-containers=true \
            --tail=200 || true

          echo ""
          echo "========================================="
          echo "OPS DASHBOARD LOGS"
          echo "========================================="
          kubectl logs \
            -n production \
            -l app=ops-dashboard \
            --all-containers=true \
            --tail=200 || true
  audit:
    name: "7. Audit Log + Compliance Dashboard"
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - vuln-scan
      - policy-check
      - risk-prediction
      - secret-rotation
      - deploy

    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Write audit event
        run: |
          RISK_SCORE="${{ needs.risk-prediction.outputs.risk_score || '0' }}"

          PIPELINE_STATUS="success"

          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          if [ "${{ needs.vuln-scan.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          if [ "${{ needs.policy-check.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          if [ "${{ needs.risk-prediction.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          if [ "${{ needs.secret-rotation.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          if [ "${{ needs.deploy.result }}" != "success" ]; then
            PIPELINE_STATUS="failed"
          fi

          echo "Pipeline status: $PIPELINE_STATUS"
          echo "Risk score: $RISK_SCORE"

          python scripts/audit_logger.py \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --actor "${{ github.actor }}" \
            --risk-score "$RISK_SCORE" \
            --status "$PIPELINE_STATUS" \
            --push-metrics "${{ secrets.PROMETHEUS_PUSHGATEWAY }}"
