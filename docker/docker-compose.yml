version: "3.9"

services:
  # ---------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: dev-only-password   # replace with Vault-injected secret in prod
      POSTGRES_DB: privacy_cicd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d privacy_cicd"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Secrets / policy
  # ---------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: vault-dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-root-token"   # dev mode ONLY — never in prod
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ../vault/policies:/vault/policies:ro

  opa:
    image: openpolicyagent/opa:0.65.0
    container_name: opa
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ../policies/opa:/policies:ro

  # ---------------------------------------------------------------------
  # The actual business application deployed by the pipeline
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: privacy-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://app_user:dev-only-password@postgres:5432/privacy_cicd"
      JWT_SECRET_KEY: "dev-only-change-me"   # replace with Vault-injected secret in prod
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../app/frontend
      dockerfile: Dockerfile
    container_name: privacy-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ---------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pushgateway
    ports:
      - "9091:9091"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://app_user:dev-only-password@postgres:5432/privacy_cicd?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"   # change on first login
    volumes:
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Centralized logging (OpenSearch — Apache-2.0 licensed ELK equivalent)
  # ---------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # dev only — enable + configure TLS/auth in prod
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    container_name: opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    volumes:
      - ../logging/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../logging/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - opensearch

  # ---------------------------------------------------------------------
  # Ops / privacy compliance dashboard (Flask; separate from the React business app)
  # ---------------------------------------------------------------------
  ops-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: privacy-ops-dashboard
    ports:
      - "5000:5000"
    environment:
      VAULT_ADDR: "http://vault:8200"
      OPA_ADDR: "http://opa:8181"
      PROMETHEUS_ADDR: "http://prometheus:9090"
    depends_on:
      - vault
      - opa
      - prometheus

volumes:
  postgres-data:
  opensearch-data:

networks:
  default:
    name: privacy-cicd-net
