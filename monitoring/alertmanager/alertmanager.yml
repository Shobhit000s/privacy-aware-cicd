global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: "security-team"
      repeat_interval: 30m

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://backend:8000/api/alerts/webhook"
        send_resolved: true

  - name: "security-team"
    webhook_configs:
      - url: "http://backend:8000/api/alerts/webhook"
        send_resolved: true
    # In production, add email_configs / slack_configs here, e.g.:
    # slack_configs:
    #   - api_url: "$SLACK_WEBHOOK_URL"
    #     channel: "#privacy-security-alerts"
    #     title: "{{ .CommonAnnotations.summary }}"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
