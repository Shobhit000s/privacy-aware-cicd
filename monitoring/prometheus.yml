global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "privacy-dashboard"
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:5000"]

  - job_name: "opa"
    metrics_path: /metrics
    static_configs:
      - targets: ["opa:8181"]

rule_files:
  - "alert_rules.yml"
